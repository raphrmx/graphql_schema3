name: graphql_schema3
version: 3.2.3
description: >-
  An implementation of the GraphQL type system in Dart. Builds object, union,
  enum, input and scalar types, and validates and coerces values against them.
homepage: https://packages.comapps.be/#graphql_schema3
repository: https://github.com/raphrmx/graphql_schema3
issue_tracker: https://github.com/raphrmx/graphql_schema3/issues
funding:
  - https://www.paypal.com/donate/?hosted_button_id=ZN6D382YQAV5N

topics:
  - graphql
  - schema
  - types

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  collection: ^1.19.1
  source_span: ^1.10.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
